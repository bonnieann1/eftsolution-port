# eftsolution.com — Netlify site config
#
# The site is a static build: edit source files, run `python3 build.py`, deploy dist/.
# No Node, no npm. The stylesheet is pre-compiled and committed — see README.md.
#
# Redirects live in dist/_redirects (generated by build.py). Do not duplicate them here.

[build]
  publish = "dist"
  command = "python3 build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

# Every page is a directory index, so the canonical URL keeps its trailing slash
# and matches the <link rel="canonical"> tags and the sitemap.
[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
